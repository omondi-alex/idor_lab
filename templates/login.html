<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SACCO Portal - Login</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; }
    input { display:block; width:100%; padding:8px; margin:6px 0; box-sizing:border-box; }
    button { padding:8px 16px; }
    .err { color:#b00; }
    .hint { color:#666; font-size:0.9em; margin-top:20px; }
  </style>
</head>
<body>
  <h2>SACCO Portal - Login</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <input name="user" placeholder="Username" autofocus>
    <input name="pass" type="password" placeholder="Password">
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Lab accounts:<br>alice / alice123<br>bob / bob123</p>
</body>
</html>
